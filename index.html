<style>
:root{
  --paper:#F1F4EF; --surface:#FFFFFF; --ink:#17221D; --muted:#5A6A62; --line:#D8E0D6;
  --green:#2C6A4D; --green-soft:#DFEDE4; --amber:#9A6508; --amber-soft:#F5E8CC;
  --red:#B3261E; --red-soft:#F8DDD9; --focus:#2C6A4D;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101612; --surface:#18201B; --ink:#E3EAE5; --muted:#98A79F; --line:#2A352F;
    --green:#7CC49C; --green-soft:#1D3127; --amber:#E3AE4B; --amber-soft:#382D15;
    --red:#F28B7F; --red-soft:#3C1F1B; --focus:#7CC49C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101612; --surface:#18201B; --ink:#E3EAE5; --muted:#98A79F; --line:#2A352F;
  --green:#7CC49C; --green-soft:#1D3127; --amber:#E3AE4B; --amber-soft:#382D15;
  --red:#F28B7F; --red-soft:#3C1F1B; --focus:#7CC49C; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
header.top h1{font:700 18px/1.2 var(--display);margin:0;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:13px}
.iconbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.banner{background:var(--amber-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.hero{padding:18px 0 22px;border-bottom:1px solid var(--line)}
.hero .lbl{font-size:15px;color:var(--muted);margin:0 0 2px}
.hero .big{font:800 clamp(52px,16vw,76px)/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:0}
.hero .meter{height:6px;border-radius:3px;margin:14px 0 10px;background:var(--line);overflow:hidden}
.hero .meter span{display:block;height:100%;border-radius:3px}
.hero .why{font-size:15px;margin:0;max-width:60ch}
.tone-ok .big{color:var(--green)} .tone-ok .meter span{background:var(--green)}
.tone-warn .big{color:var(--amber)} .tone-warn .meter span{background:var(--amber)}
.tone-bad .big{color:var(--red)} .tone-bad .meter span{background:var(--red)}
section.blk{padding:18px 0;border-bottom:1px solid var(--line)}
section.blk:last-child{border-bottom:0}
h2{font:700 19px/1.25 var(--display);margin:0 0 10px;letter-spacing:-.01em}
h3{font:600 16px/1.3 var(--body);margin:14px 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:600;overflow-wrap:anywhere}
.row .meta{font-size:13px;color:var(--muted)}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.amt.neg{color:var(--red)} .amt.pos{color:var(--green)}
.tick{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.tick.on{background:var(--green);border-color:var(--green);color:var(--paper)}
.tick svg{width:16px;height:16px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.late{background:var(--red)} .dot.soon{background:var(--amber)}
.sumline{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-variant-numeric:tabular-nums}
.sumline.total{font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--green);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn.small{padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
label.f{display:block;margin:10px 0}
label.f span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:96px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}
.bar span{display:block;height:100%;background:var(--green)}
.goal{padding:14px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0}
.pill{display:inline-block;font-size:13px;border-radius:999px;padding:2px 9px;background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--amber-soft);color:var(--amber)} .pill.bad{background:var(--red-soft);color:var(--red)}
.verdict{border-radius:12px;padding:14px;margin-top:12px}
.verdict h3{font:800 24px/1.1 var(--display);margin:0 0 8px}
.verdict.v-si{background:var(--green-soft)} .verdict.v-si h3{color:var(--green)}
.verdict.v-attesa,.verdict.v-aspetta,.verdict.v-obiettivo{background:var(--amber-soft)}
.verdict.v-attesa h3,.verdict.v-aspetta h3,.verdict.v-obiettivo h3{color:var(--amber)}
.verdict.v-no{background:var(--red-soft)} .verdict.v-no h3{color:var(--red)}
.verdict ul{margin:0;padding-left:18px} .verdict li{margin:4px 0}
.answer{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;min-height:3em}
.rules li{margin:6px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:12px 2px 13px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--green)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-bottom:4px}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.monthnav b{font-weight:600;text-transform:capitalize}
.empty{padding:28px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl th,.tbl td{text-align:right;padding:6px 4px;border-top:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tblwrap{overflow-x:auto}
@media (prefers-reduced-motion: no-preference){.hero .meter span{transition:width .5s ease}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div><h1>Conti in tasca</h1><div class="sub" id="subtitle">Caricamento…</div></div>
    <button class="iconbtn" id="btnSettings" aria-label="Impostazioni">Impostazioni</button>
  </header>
  <div id="banner"></div>
  <main id="main"><div class="empty muted">Caricamento dei tuoi dati…</div></main>
</div>
<nav class="tabs" aria-label="Sezioni"><div class="in">
  <button data-tab="oggi">Oggi</button>
  <button data-tab="fisse">Fisse</button>
  <button data-tab="spese">Spese</button>
  <button data-tab="obiettivi">Obiettivi</button>
  <button data-tab="chiedi">Chiedi</button>
</div></nav>
<div id="sheetRoot"></div>

<script>
/* ---------- utilità ---------- */
const EUR = new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'});
const fmtE = n => (n==null || !isFinite(n)) ? '—' : EUR.format(n);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const x = parseFloat(String(v ?? '').replace(/\s/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.')); return isFinite(x) ? x : NaN; };
const r2 = n => Math.round(n*100)/100;
const newId = () => ((crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2))).replace(/-/g,'').slice(0,16);
const clone = o => JSON.parse(JSON.stringify(o));
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pd(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y,(m||1)-1,d||1,12); }
const today = () => ymd(new Date());
function addDays(s,n){ const d = pd(s); d.setDate(d.getDate()+n); return ymd(d); }
const mkey = s => s.slice(0,7);
function dim(y,m){ return new Date(y,m,0).getDate(); }
function dueIn(giorno,key){ const [y,m] = key.split('-').map(Number); return key+'-'+String(Math.min(giorno,dim(y,m))).padStart(2,'0'); }
function shiftKey(key,n){ let [y,m] = key.split('-').map(Number); m += n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+'-'+String(m).padStart(2,'0'); }
const monthIndex = key => { const [y,m] = key.split('-').map(Number); return y*12+m; };
const fmtPct = n => n.toLocaleString('it-IT',{maximumFractionDigits:1})+'%';
const fmtD = s => pd(s).toLocaleDateString('it-IT',{day:'numeric',month:'long'});
const fmtMese = key => pd(key+'-01').toLocaleDateString('it-IT',{month:'long',year:'numeric'});
const minStr = (a,b) => a<b ? a : b;

/* ---------- stato ---------- */
const S = { mode:'loading', db:null, uid:null, sample:null, downloads:null, config:null, mesi:{}, tab:'oggi', viewKey:null, askCtl:null, askText:'', calc:null };
const SIGN = {entrata:1, prelievo:1, fissa:-1, extra:-1, accantonamento:-1};
const CATEGORIE = ['Spesa alimentare','Carburante','Trasporti e parcheggi','Salute','Bar e ristoranti','Abbigliamento','Svago','Viaggi','Elettronica','Casa','Regali','Animali','Altro'];
const ESSENZIALI = ['Spesa alimentare','Carburante','Trasporti e parcheggi','Salute'];

function emptyConfig(){
  return { versione:1, impostazioni:{ nettoPrudente:1800, cuscinetto:50, essenziali:200, rateContoComune:0,
    soglie:{ rateMaxPct:30, sogliaExtra:100, sogliaObiettivo:500, provaMesi:3, straordinariePct:70 } },
    accrediti:[{id:'stipendio',nome:'Stipendio',importo:1800,giorno:15}], fisse:[], obiettivi:[], riconciliazione:null };
}

/* ---------- persistenza ---------- */
const queues = {};
function enqueue(key, fn){ const p = (queues[key]||Promise.resolve()).then(fn).catch(e => { console.error(e); toast(e && e.code==='quota_exceeded' ? 'Spazio dati esaurito: esporta un backup e scrivi a Claude.' : 'Salvataggio non riuscito, riprova.'); }); queues[key]=p; return p; }
function cfgPath(){ return 'data/users/'+S.uid+'/config'; }
function saveConfig(){
  if(S.mode==='remote'){ const data = clone(S.config); return enqueue('config', () => S.db.doc(cfgPath()).set(data)); }
  try{ localStorage.setItem('cit:config', JSON.stringify(S.config)); }catch(e){ toast('Salvataggio non riuscito: esporta subito un backup.'); }
  return Promise.resolve();
}
function saveMese(key){
  if(!S.mesi[key]) S.mesi[key] = {mese:key, movimenti:[]};
  if(S.mode==='remote'){ const data = clone(S.mesi[key]); return enqueue('m'+key, () => S.db.doc(cfgPath()).collection('mesi').doc(key).set(data)); }
  try{ localStorage.setItem('cit:mesi', JSON.stringify(S.mesi)); }catch(e){ toast('Salvataggio non riuscito: esporta subito un backup.'); }
  return Promise.resolve();
}

async function init(){
  wireStatic();
  S.mode='local';
  try{ S.config = JSON.parse(localStorage.getItem('cit:config')||'null'); S.mesi = JSON.parse(localStorage.getItem('cit:mesi')||'{}'); }catch(e){ S.config=null; S.mesi={}; }
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  render();
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
}
async function importaBackup(file){
  const d = JSON.parse(await file.text());
  if(!d.config || !d.config.impostazioni) throw new Error('formato');
  S.config = d.config; S.mesi = d.mesi || {};
  await saveConfig(); await saveMese(Object.keys(S.mesi)[0] || mkey(today()));
}

/* ---------- movimenti ---------- */
function movs(key){ return (S.mesi[key] && S.mesi[key].movimenti) || []; }
function allMovs(){ return Object.values(S.mesi).flatMap(m => m.movimenti || []); }
function addMov(m){
  const key = mkey(m.data);
  if(!S.mesi[key]) S.mesi[key] = {mese:key, movimenti:[]};
  const mv = Object.assign({id:newId(), ts:Date.now()}, m); mv.importo = r2(mv.importo);
  S.mesi[key].movimenti.push(mv);
  return saveMese(key);
}
function delMov(id){
  for(const key of Object.keys(S.mesi)){
    const arr = S.mesi[key].movimenti || []; const i = arr.findIndex(x => x.id===id);
    if(i>=0){ const [m] = arr.splice(i,1); saveMese(key); return m; }
  }
  return null;
}
function tickOf(fid,key){ return movs(key).filter(m => m.tipo==='fissa' && m.rif===fid); }
function fissaAttiva(f,key){ return !(f.fine && f.fine < key) && !(f.dal && f.dal > key); }
const ogniDi = f => (f.ogni && f.ogni > 1) ? f.ogni : 1;
function inCiclo(f,key){ const n = ogniDi(f); if(n===1 || !f.ultimo) return true; const d = monthIndex(key) - monthIndex(f.ultimo); return d % n === 0; }
function dovuta(f,key){ return fissaAttiva(f,key) && inCiclo(f,key); }
function prossimaScadenza(f,key){ for(let i=0;i<=24;i++){ const k2 = shiftKey(key,i); if(dovuta(f,k2) && !tickOf(f.id,k2).length) return dueIn(f.giorno,k2); } return null; }
const FREQ = {1:'mensile',2:'bimestrale',3:'trimestrale',6:'semestrale',12:'annuale'};
function goalAttivo(g,key){ return (g.quota||0)>0 && (g.accantonato||0) < g.target && !(g.dal && g.dal > key) && !(g.scadenza && mkey(g.scadenza) < key); }
function versatoMese(gid,key){ return movs(key).filter(m => m.tipo==='accantonamento' && m.rif===gid).reduce((a,m)=>a+m.importo,0); }
function necessarioMese(g, key){
  const start = (g.dal && g.dal > key) ? g.dal : key;
  const resto = Math.max(0, g.target - (g.accantonato||0));
  if(!g.scadenza) return null;
  const mesi = Math.max(1, monthIndex(mkey(g.scadenza)) - monthIndex(start));
  return r2(resto / mesi);
}

function received(aid, from, to){ return allMovs().some(m => m.tipo==='entrata' && m.rif===aid && m.data>=from && m.data<=to); }
function nextAccredito(t){
  let best=null; const k=mkey(t);
  for(const a of (S.config.accrediti||[])){
    for(const kk of [shiftKey(k,-1), k, shiftKey(k,1)]){
      const P = dueIn(a.giorno, kk); let cand=null, late=false;
      if(P < t){ if(P >= addDays(t,-20) && !received(a.id, addDays(P,-25), minStr(t, addDays(P,15)))){ cand=t; late=true; } }
      else if(!received(a.id, addDays(P,-25), t)) cand=P;
      if(cand){ if(!best || cand < best.data) best = {data:cand, a, late, prevista:P}; break; }
    }
  }
  return best;
}

/* ---------- calcoli principali ---------- */
function calc(){
  const c=S.config, t=today(), k=mkey(t), imp=c.impostazioni;
  let cassa=null;
  if(c.riconciliazione){
    cassa = c.riconciliazione.saldoConti - (c.riconciliazione.amexDaAddebitare||0);
    // conta solo i movimenti registrati dopo l'ultimo saldo e con data non precedente: quelli più vecchi sono già nel saldo reale
    for(const m of allMovs()) if((m.ts||0) > c.riconciliazione.ts && m.data >= c.riconciliazione.data) cassa += SIGN[m.tipo]*m.importo;
    cassa = r2(cassa);
  }
  const acc = nextAccredito(t);
  const H = acc ? acc.data : addDays(t,31);
  const pending=[];
  for(const f of c.fisse){
    let due=null;
    if(dovuta(f,k) && !tickOf(f.id,k).length) due = dueIn(f.giorno,k);
    else { const nk=shiftKey(k,1); if(dovuta(f,nk) && !tickOf(f.id,nk).length) due = dueIn(f.giorno,nk); }
    // le spese che scadono lo stesso giorno dell'entrata si pagano con quell'entrata
    if(due && due < H) pending.push({f, due, late: due < t});
  }
  pending.sort((a,b) => a.due.localeCompare(b.due));
  const pendingTot = r2(pending.reduce((a,p)=>a+p.f.importo,0));
  const goals = c.obiettivi.filter(g => goalAttivo(g,k));
  const mancanti = goals.map(g => ({g, manca: r2(Math.max(0, g.quota - versatoMese(g.id,k)))})).filter(x => x.manca>0);
  const mancTot = r2(mancanti.reduce((a,x)=>a+x.manca,0));
  const spendCassa = cassa==null ? null : r2(cassa - pendingTot - mancTot - (imp.cuscinetto||0));
  let fisseMese=0;
  // le spese non mensili pesano sul budget come quota mensile (es. trimestrale = importo/3), l'addebito vero conta solo sulla liquidità
  for(const f of c.fisse){ if(!fissaAttiva(f,k)) continue; if(ogniDi(f)>1){ fisseMese += f.importo/ogniDi(f); continue; } const tk=tickOf(f.id,k); fisseMese += tk.length ? tk.reduce((a,m)=>a+m.importo,0) : f.importo; }
  fisseMese = r2(fisseMese);
  const quote = r2(goals.reduce((a,g)=>a+g.quota,0));
  const budgetVar = r2(imp.nettoPrudente - fisseMese - quote);
  const extra = movs(k).filter(m => m.tipo==='extra');
  const extraMese = r2(extra.reduce((a,m)=>a+m.importo,0));
  const essMese = r2(extra.filter(m => ESSENZIALI.includes(m.cat)).reduce((a,m)=>a+m.importo,0));
  const rimasto = r2(budgetVar - extraMese);
  const puoi = spendCassa==null ? rimasto : Math.min(spendCassa, rimasto);
  const limite = spendCassa!=null && spendCassa < rimasto ? 'cassa' : 'budget';
  const rateEsistenti = r2(c.fisse.filter(f => f.rata && fissaAttiva(f,k)).reduce((a,f)=>a+f.importo,0) + (imp.rateContoComune||0));
  const quoteRegime = r2(c.obiettivi.filter(g => (g.quota||0)>0 && (g.accantonato||0) < g.target && !(g.scadenza && mkey(g.scadenza) < k)).reduce((a,g)=>a+g.quota,0));
  // mese tipo: senza le spese una tantum (inizio e fine nello stesso mese) e senza quelle che finiscono questo mese
  let fisseRegime = 0;
  for(const f of c.fisse){ if(!fissaAttiva(f,k) || (f.fine && f.fine <= k) ) continue; fisseRegime += f.importo/ogniDi(f); }
  const strutturale = r2(imp.nettoPrudente - fisseRegime - quoteRegime - (imp.essenziali||0));
  return {t,k,cassa,acc,H,pending,pendingTot,mancanti,mancTot,spendCassa,fisseMese,quote,quoteRegime,budgetVar,extraMese,essMese,rimasto,puoi,limite,rateEsistenti,strutturale};
}

function storico(n){
  const out=[]; const k=mkey(today());
  for(let i=n; i>=1; i--){
    const key=shiftKey(k,-i); const ms=movs(key); if(!ms.length) continue;
    const ent=ms.filter(m=>m.tipo==='entrata').reduce((a,m)=>a+m.importo,0);
    const fis=ms.filter(m=>m.tipo==='fissa').reduce((a,m)=>a+m.importo,0);
    const ext=ms.filter(m=>m.tipo==='extra').reduce((a,m)=>a+m.importo,0);
    const acc=ms.filter(m=>m.tipo==='accantonamento').reduce((a,m)=>a+m.importo,0);
    out.push({mese:key, entrate:r2(ent), fisse:r2(fis), extra:r2(ext), accantonato:r2(acc), saldo:r2(ent-fis-ext)});
  }
  return out;
}

function regole(){
  const s=S.config.impostazioni.soglie;
  return [
    `R1 · Nessuna nuova rata se il mese tipo chiude in negativo o se le rate totali superano il ${s.rateMaxPct}% del netto.`,
    `R2 · Ogni euro in entrata va prima alle spese fisse, poi agli accantonamenti, e solo dopo agli extra.`,
    `R3 · Extra sotto ${fmtE(s.sogliaExtra)}: liberi se ci stanno. Da ${fmtE(s.sogliaExtra)} in su: 48 ore di attesa. Da ${fmtE(s.sogliaObiettivo)} in su: diventano un obiettivo pianificato.`,
    `R4 · Il fondo di emergenza si tocca solo per imprevisti non rimandabili (salute, auto, casa, lavoro). Se lo usi, ricostituirlo è la priorità del mese dopo.`,
    `R5 · Entrate straordinarie (rimborsi, bonus): ${s.straordinariePct}% a obiettivi e cuscinetto, il resto è libero.`,
    `R6 · Un risparmio nuovo (es. sigarette) va su un obiettivo per ${s.provaMesi} mesi prima di diventare spendibile.`,

    `R8 · Spese sanitarie in corso e psicologa sono intoccabili.`
  ];
}

function render(){

/* ---------- posso comprarlo? ---------- */
function valuta(prezzo, aRate, nRate){
  const x = calc(), c=S.config, imp=c.impostazioni, s=imp.soglie; const r=[]; let v='si'; let rata=null, mesi=null;
  const fondo = c.obiettivi.find(g => g.tipo==='emergenza');
  const fondoBasso = fondo && (fondo.accantonato||0) < fondo.target;
  const hist = storico(3); const media3 = hist.length>=3 ? hist.reduce((a,h)=>a+h.saldo,0)/hist.length : null;
  if(x.strutturale>0) mesi = Math.ceil(prezzo / x.strutturale);
  if(aRate){
    rata = r2(prezzo / nRate);
    const pctR = (x.rateEsistenti + rata) / imp.nettoPrudente * 100;
    if(pctR > s.rateMaxPct){ v='no'; r.push(`R1: con questa rata le rate salirebbero da ${fmtE(x.rateEsistenti)} a ${fmtE(x.rateEsistenti+rata)} al mese, il ${fmtPct(pctR)} del netto. Il limite è ${s.rateMaxPct}%.`); }
    else r.push(`Le rate totali salirebbero al ${fmtPct(pctR)} del netto, sotto il limite del ${s.rateMaxPct}%.`);
    if(x.strutturale - rata < 0){ v='no'; r.push(`R1: il mese tipo, dopo fisse, accantonamenti e spese essenziali stimate, lascia ${fmtE(x.strutturale)}. Con una rata di ${fmtE(rata)} scenderebbe a ${fmtE(x.strutturale-rata)}.`); }
    if(media3!=null && media3<0){ v='no'; r.push(`R1: negli ultimi 3 mesi registrati il saldo medio è stato ${fmtE(media3)}.`); }
    if(fondoBasso) r.push(`Il fondo di emergenza è a ${fmtE(fondo.accantonato||0)} su un minimo di ${fmtE(fondo.target)}: una rata in più riduce il margine per completarlo.`);
    r.push('Calcolo senza interessi: se il finanziamento ha un TAEG, la rata reale è più alta.');
  } else if(prezzo >= s.sogliaObiettivo){
    v='obiettivo'; r.push(`R3: da ${fmtE(s.sogliaObiettivo)} in su un acquisto va pianificato come obiettivo, non deciso sul momento.`);
    r.push(mesi ? `Con il margine mensile attuale (${fmtE(x.strutturale)} dopo fisse, accantonamenti ed essenziali) servono circa ${mesi} mesi.` + (mesi>24 ? ' Senza liberare margine, con tagli o rinviando un altro obiettivo, non è realistico.' : '') : `Oggi il margine mensile dopo fisse, accantonamenti ed essenziali è ${fmtE(x.strutturale)}: per mettere da parte questa cifra bisogna prima tagliare altre spese o rinviare un obiettivo.`);
  } else {
    if(prezzo > x.puoi){
      if(x.limite==='cassa' && prezzo <= x.rimasto){ v='aspetta'; r.push(x.puoi<=0 ? `Nel budget del mese ci starebbe, ma oggi sul conto non c'è margine: per coprire le spese fisse fino al ${fmtD(x.H)} mancano già ${fmtE(-x.puoi)}. Riparliamone dopo quella data.` : `Nel budget del mese ci starebbe, ma fino al ${fmtD(x.H)} sul conto puoi spendere solo ${fmtE(x.puoi)}. Riparliamone dopo quella data.`); }
      else { v='no'; r.push(x.puoi<=0 ? `Oggi non c'è margine per nessun extra. Il budget per spese variabili ed extra di questo mese ha ${fmtE(x.rimasto)}.` : `Supera quanto puoi spendere oggi (${fmtE(x.puoi)}). Il budget per spese variabili ed extra di questo mese ha ancora ${fmtE(x.rimasto)}.`); }
    } else if(prezzo >= s.sogliaExtra){ v='attesa'; r.push(`R3: ci sta (puoi spendere ${fmtE(x.puoi)} oggi), ma è sopra ${fmtE(s.sogliaExtra)}. Aspetta 48 ore e ricontrolla: se lo vuoi ancora, è una scelta e non un impulso.`); }
    else r.push(`Ci sta: oggi puoi spendere ${fmtE(x.puoi)}, dopo l'acquisto resterebbero ${fmtE(x.puoi-prezzo)}.`);
    if(fondoBasso && prezzo >= s.sogliaExtra && (v==='si' || v==='attesa')){ v='aspetta'; r.push(`R2 e R4: il fondo di emergenza è a ${fmtE(fondo.accantonato||0)} su un minimo di ${fmtE(fondo.target)}. Prima si completano gli accantonamenti del mese.`); }
  }
  r.push('R6: se conti su un risparmio nuovo per pagarlo, vale solo dopo che si è visto nei dati per 3 mesi.');
  const titoli = {si:'Sì', attesa:'Sì, tra 48 ore', aspetta:'Aspetta', obiettivo:'Diventa un obiettivo', no:'No, non ora'};
  return {v, titolo:titoli[v], r, rata, mesi};
}

  };
  const q = main.querySelector('#aQ'), go = main.querySelector('#aGo'), out = main.querySelector('#aOut');

  const x = calc(), c=S.config, k=x.k;
  return {
    oggi: x.t,

    entrate_attese: c.accrediti,
    spese_fisse: c.fisse.filter(f => fissaAttiva(f,k)).map(f => ({nome:f.nome, importo:f.importo, frequenza:FREQ[ogniDi(f)], dovuta_questo_mese:inCiclo(f,k), giorno:f.giorno, conto:f.conto, variabile:!!f.variabile, rata:!!f.rata, fine:f.fine||null, intoccabile:!!f.intoccabile, pagata_questo_mese: tickOf(f.id,k).length>0})),
    obiettivi: c.obiettivi.map(g => ({nome:g.nome, tipo:g.tipo||null, target:g.target, accantonato:g.accantonato||0, quota_mensile:g.quota, scadenza:g.scadenza||null, parte_da:g.dal||null, necessario_al_mese:necessarioMese(g,k), note:g.note||null})),
    situazione: { liquidita_conti_personali: x.cassa, puoi_spendere_oggi: x.puoi, limitato_da: x.limite, prossima_entrata: x.acc ? {nome:x.acc.a.nome, entro:x.acc.data} : null,
      fisse_da_pagare_prima_della_prossima_entrata: x.pending.map(p => ({nome:p.f.nome, importo:p.f.importo, data:p.due})),
      accantonamenti_mancanti_del_mese: x.mancTot, budget_mese_variabili_ed_extra: x.budgetVar, spesi_nel_mese: x.extraMese, rimasto_nel_mese: x.rimasto,
      rate_attuali_mensili: x.rateEsistenti, margine_mensile_tipo_dopo_essenziali: x.strutturale },
    spese_del_mese: movs(k).filter(m => m.tipo==='extra').slice(-60).map(m => ({data:m.data, importo:m.importo, categoria:m.cat, descr:m.descr})),
    storico_mesi: storico(6),
    ultimo_calcolo_posso_comprarlo: S.calc ? {cosa:S.calc.cosa, prezzo:S.calc.prezzo, a_rate:S.calc.aRate, rate:S.calc.n, esito:S.calc.res.titolo} : null
  };
}
function promptClaude(domanda){
  return `Sei il consulente finanziario personale di una persona che vive in Italia (lavoratore dipendente, convive nella casa di proprietà del compagno). Rispondi in italiano.

Come rispondere:
- Inizia con una conclusione netta in una riga: "Sì", "Sì, ma…", "Aspetta fino a …" oppure "No", poi spiega in poche frasi.
- Ragiona con i numeri qui sotto: importi in euro, percentuali, date. Non inventare dati che non ci sono; se manca qualcosa, dillo e indica quale dato serve.
- Applica sempre le regole della persona. Se una regola blocca la richiesta, citala (es. "R1").
- Sii diretto sui punti deboli, senza addolcire, ma con rispetto.
- Non raccomandare prodotti finanziari specifici. Se serve un professionista (consulente, commercialista, notaio), dillo.
- Massimo circa 200 parole. Testo semplice, senza tabelle né titoli.

Regole della persona:
${regole().join('\n')}

Dati attuali dell'app (JSON):
${JSON.stringify(contesto())}

Domanda: ${domanda}`;
}

/* ---------- fogli modali ---------- */
function sheet(html, onMount){
  const root = document.getElementById('sheetRoot');
  root.innerHTML = `<div class="sheet-bg" role="presentation"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const bg = root.querySelector('.sheet-bg');
  const close = () => { root.innerHTML=''; document.removeEventListener('keydown', onKey); };
  const onKey = e => { if(e.key==='Escape') close(); };
  document.addEventListener('keydown', onKey);
  bg.addEventListener('click', e => { if(e.target===bg) close(); });
  root.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  const first = root.querySelector('input,select,textarea'); if(first) setTimeout(() => first.focus(), 30);
  if(onMount) onMount(root.querySelector('.sheet'), close);
}

    el.querySelector('#xBack').onclick = () => openFisseEditor();
    el.querySelector('#xOk').onclick = () => {
      const nome = el.querySelector('#xN').value.trim(); const imp = num(el.querySelector('#xI').value); const g = parseInt(el.querySelector('#xG').value,10);
      if(!nome || !(imp>=0) || !(g>=1 && g<=31)){ toast('Controlla nome, importo e giorno'); return; }
      const ogni = parseInt(el.querySelector('#xQ').value,10)||1; const ultimo = el.querySelector('#xU').value||'';
      if(ogni>1 && !ultimo){ toast('Indica l\'ultimo mese addebitato'); return; }
      Object.assign(f, {ogni, ultimo, nome, importo:r2(imp), giorno:g, conto:el.querySelector('#xC').value.trim(), fine:el.querySelector('#xF').value||'', variabile:el.querySelector('#xV').checked, rata:el.querySelector('#xR').checked, intoccabile:el.querySelector('#xT').checked});
      if(!fid) S.config.fisse.push(f);
      saveConfig(); render(); openFisseEditor(); toast('Spesa fissa salvata');
    };
    const d = el.querySelector('#xDel'); if(d) d.onclick = () => { if(confirm('Eliminare "'+f.nome+'"? Se è solo finita, meglio impostare l\'ultimo mese.')){ S.config.fisse = S.config.fisse.filter(x => x.id!==fid); saveConfig(); render(); openFisseEditor(); } };
  });
}

function openSettings(){
  const c=S.config, imp=c.impostazioni, s=imp.soglie;
  sheet(`<h2>Impostazioni</h2>
    <h3>Entrate</h3>
    <label class="f"><span>Netto mensile prudente (€)</span><input type="text" inputmode="decimal" id="tN" value="${imp.nettoPrudente}"></label>
    ${(c.accrediti||[]).map((a,i) => `<div class="grid2"><label class="f"><span>${esc(a.nome)}: importo atteso</span><input type="text" inputmode="decimal" data-ai="${i}" value="${a.importo}"></label><label class="f"><span>Giorno prudente</span><input type="number" min="1" max="31" data-ag="${i}" value="${a.giorno}"></label></div>`).join('')}
    <h3>Margini</h3>
    <div class="grid2">
      <label class="f"><span>Cuscinetto minimo sul conto (€)</span><input type="text" inputmode="decimal" id="tC" value="${imp.cuscinetto}"></label>
      <label class="f"><span>Spesa e carburante stimati al mese (€)</span><input type="text" inputmode="decimal" id="tE" value="${imp.essenziali}"></label>
      <label class="f"><span>Rate pagate dal conto comune (€)</span><input type="text" inputmode="decimal" id="tR" value="${imp.rateContoComune||0}"></label>
    </div>
    <h3>Soglie delle regole</h3>
    <div class="grid2">
      <label class="f"><span>R1 · Rate massime (% del netto)</span><input type="number" id="s1" value="${s.rateMaxPct}"></label>
      <label class="f"><span>R3 · Soglia attesa 48 ore (€)</span><input type="number" id="s3" value="${s.sogliaExtra}"></label>
      <label class="f"><span>R3 · Soglia obiettivo (€)</span><input type="number" id="s3b" value="${s.sogliaObiettivo}"></label>
      <label class="f"><span>R6 · Mesi di prova</span><input type="number" id="s6" value="${s.provaMesi}"></label>
      <label class="f"><span>R5 · % a obiettivi</span><input type="number" id="s5" value="${s.straordinariePct}"></label>
    </div>
    <div class="btns"><button class="btn" id="tOk">Salva</button><button class="btn ghost" data-close>Chiudi</button></div>
    <h3>Backup</h3>
    <p class="small muted">I dati sono solo su questo telefono. Esporta un backup almeno una volta al mese e scegli "Salva su File", poi iCloud Drive.</p>
    <div class="btns"><button class="btn ghost small" id="bJ">Esporta backup (JSON)</button><button class="btn ghost small" id="bC">Esporta movimenti (CSV)</button><label class="btn ghost small" style="display:inline-block">Ripristina backup<input type="file" id="bI" accept="application/json,.json" hidden></label></div>
    <h3>Aspetto</h3>
    <div class="btns"><button class="btn ghost small" data-th="">Automatico</button><button class="btn ghost small" data-th="light">Chiaro</button><button class="btn ghost small" data-th="dark">Scuro</button></div>`,
  (el, close) => {
    el.querySelector('#tOk').onclick = () => {
      imp.nettoPrudente = r2(num(el.querySelector('#tN').value)||imp.nettoPrudente);
      el.querySelectorAll('[data-ai]').forEach(i => { const v=num(i.value); if(v>0) c.accrediti[+i.dataset.ai].importo = r2(v); });
      el.querySelectorAll('[data-ag]').forEach(i => { const v=parseInt(i.value,10); if(v>=1&&v<=31) c.accrediti[+i.dataset.ag].giorno = v; });
      imp.cuscinetto = r2(num(el.querySelector('#tC').value)||0); imp.essenziali = r2(num(el.querySelector('#tE').value)||0); imp.rateContoComune = r2(num(el.querySelector('#tR').value)||0);
      const gi = (id,d) => { const v = parseFloat(el.querySelector(id).value); return isFinite(v) ? v : d; };
      s.rateMaxPct = gi('#s1',s.rateMaxPct); s.sogliaExtra = gi('#s3',s.sogliaExtra); s.sogliaObiettivo = gi('#s3b',s.sogliaObiettivo); s.provaMesi = gi('#s6',s.provaMesi); s.straordinariePct = gi('#s5',s.straordinariePct);
      saveConfig(); close(); render(); toast('Impostazioni salvate');
    };
    el.querySelector('#bJ').onclick = () => scarica('conti-in-tasca-backup-'+today()+'.json', JSON.stringify({config:S.config, mesi:S.mesi}, null, 2));
    el.querySelector('#bC').onclick = () => {
      const rows = [['data','tipo','importo','categoria','descrizione','metodo']];
      allMovs().slice().sort((a,b)=>a.data.localeCompare(b.data)).forEach(m => rows.push([m.data, m.tipo, String(m.importo).replace('.',','), m.cat||'', (m.descr||'').replace(/"/g,'""'), m.metodo||'']));
      scarica('conti-in-tasca-movimenti-'+today()+'.csv', rows.map(r => r.map(v => `"${v}"`).join(';')).join('\n'));
    };
    el.querySelector('#bI').onchange = async e => {
      const file = e.target.files[0]; if(!file) return;
      try{ const d = JSON.parse(await file.text()); if(!d.config || !d.config.impostazioni) throw 0;
        if(!confirm('Sostituire tutti i dati attuali con quelli del backup?')) return;
        S.config = d.config; S.mesi = d.mesi || {}; await saveConfig(); await saveMese(Object.keys(S.mesi)[0] || mkey(today()));
        close(); render(); toast('Backup ripristinato');
      }catch(err){ toast('File non valido: serve un backup esportato da questa app.'); }
    };
    el.querySelectorAll('[data-th]').forEach(b => b.onclick = () => { const v=b.dataset.th; if(v) document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme'); try{ localStorage.setItem('cit:theme', v); }catch(e){} });
  });
}

async function scarica(filename, data){
  const type = filename.endsWith('.json') ? 'application/json' : 'text/csv';
  const file = new File([data], filename, {type});
  const segna = () => { if(filename.endsWith('.json')){ try{ localStorage.setItem('cit:lastBackup', today()); }catch(e){} render(); } };
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); segna(); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const url = URL.createObjectURL(file); const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); segna();
}

let toastT;
function toast(msg){
  let el = document.querySelector('.toast'); if(!el){ el = document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2600);
}

try{ const th = localStorage.getItem('cit:theme'); if(th) document.documentElement.setAttribute('data-theme', th); }catch(e){}
init();
</script>
</body>
</html>
